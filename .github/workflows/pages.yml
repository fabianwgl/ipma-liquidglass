name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          node --check public/vendor/liquidGL.js
          test -f public/.nojekyll
          test -z "$(find public -type l -print -quit)"
          test -z "$(find public -mindepth 1 ! -type d ! -type f -print -quit)"
          expected="$(printf '%s\n' .nojekyll app.js index.html style.css vendor/LICENSE.txt vendor/liquidGL.js)"
          actual="$(find public -type f -printf '%P\n' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          ! grep -nE '(src|href)="/' public/index.html
          ! grep -RInF '/api/' public --exclude=liquidGL.js
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./public
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
