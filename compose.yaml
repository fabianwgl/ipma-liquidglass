services:
  weather:
    build: .
    image: ipma-weather:local
    container_name: ipma-weather
    ports:
      - "${WEATHER_BIND:-127.0.0.1}:8090:8090"
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.40
    pids_limit: 48
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
